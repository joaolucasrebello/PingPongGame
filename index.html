<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG Game</h1>
        <div class="scoreboard">
            <div class="player-score">
                <p>Player</p>
                <span id="playerScore">0</span>
            </div>
            <div class="score-divider">-</div>
            <div class="computer-score">
                <p>Computer</p>
                <span id="computerScore">0</span>
            </div>
        </div>
        
        <div class="game-info">
            <p>Controls: Mouse Y-position or Arrow Keys (↑/↓)</p>
        </div>

        <canvas id="pongCanvas" width="800" height="400"></canvas>

        <div class="game-controls">
            <button id="startBtn" class="btn">Start Game</button>
            <button id="resetBtn" class="btn">Reset Score</button>
        </div>

        <div class="instructions">
            <h3>How to Play:</h3>
            <ul>
                <li>Move your paddle (left) with your mouse or arrow keys</li>
                <li>Hit the ball to score points</li>
                <li>First to 11 points wins!</li>
                <li>The computer controls the right paddle</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
